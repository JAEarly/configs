# $HOME/.config/helix/languages.toml

# Language-specific settings

[language-server.typos-lsp]
command = "typos-lsp"

[[language]]
name = "rust"
auto-format = true
formatter = { command = "rustfmt" }
language-servers = ["typos-lsp", "rust-analyzer"]

[[language]]
name = "python"
auto-format = true
# formatter = { command = "ruff", args = ["format", "-"] }
formatter = { command = "kw", args = ["r", "fmt"] }
language-servers = ["pyright"]

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.pyright.config]
reportMissingTypeStubs = false

[[language]]
name = "javascript"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "typescript"] }
language-servers = ["typos-lsp", "typescript-language-server"]

[[language]]
name = "typescript"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "typescript"] }
language-servers = ["typos-lsp", "typescript-language-server"]

[[language]]
name = "json"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "json"] }
language-servers = ["typos-lsp"]

[[language]]
name = "toml"
auto-format = true
language-servers = ["typos-lsp"]

[[language]]
name = "markdown"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "markdown"] }
language-servers = ["typos-lsp"]
