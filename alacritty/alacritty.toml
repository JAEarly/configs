# $HOME/.config/alacritty/alacritty.toml

[general]
import = [
  "~/.config/alacritty/catppuccin-mocha.toml"
]

[window]
opacity = 1.0
padding.x =5
padding.y = 2
startup_mode = "Windowed"
option_as_alt = "None"

[keyboard]
bindings = [
  { key = "Left",  mods = "Alt",     chars = "\u001bB"   },
  { key = "Right", mods = "Alt",     chars = "\u001bF"   },
  { key = "Left",  mods = "Command", chars = "\u001bOH"  },
  { key = "Right", mods = "Command", chars =  "\u001bOF" },
  { key = "Back",  mods = "Command", chars = "\u0015"    },

  # Vim-style navigation (Command modifier)
  { key = "K", mods = "Command", chars = "\u001b[A" },  # Up arrow (previous command)
  { key = "J", mods = "Command", chars = "\u001b[B" },  # Down arrow (next command)
  { key = "H", mods = "Command", chars = "\u001b[D" },  # Left arrow (cursor left)
  { key = "L", mods = "Command", chars = "\u001b[C" },  # Right arrow (cursor right)

  # Vim-style navigation (Alt/Escape modifier)
  { key = "K", mods = "Alt", chars = "\u001b[A" },  # Up arrow (previous command)
  { key = "J", mods = "Alt", chars = "\u001b[B" },  # Down arrow (next command)
  { key = "H", mods = "Alt", chars = "\u001b[D" },  # Left arrow (cursor left)
  { key = "L", mods = "Alt", chars = "\u001b[C" },  # Right arrow (cursor right)
]

[terminal]
# Let bash handle Zellij auto-attach via bashrc_extensions.sh
shell.program = "/bin/bash"
shell.args = ["-l"]

[env]
TERM = "xterm-256color"
